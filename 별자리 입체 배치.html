<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>별자리 입체 배치</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* 구성: 검정 바탕 위에 왼쪽은 남색 별 지도판(캔버스), 오른쪽은 안내·자료 패널. 좁은 화면에서는 위아래로 쌓는다.
   색: 검정 / 별빛 금색(별·강조 글씨) / 하늘색(조작 요소) / 남색 지도판. 한 가지 어두운 테마만 쓴다. */
:root {
  --font: "Malgun Gothic", "맑은 고딕", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --bg: #000000;
  --panel: #0d0f15;
  --plate: #14224a;
  --ink: #f2f5fb;
  --muted: #a3aec7;
  --border: #272b38;
  --border-strong: #3a4256;
  --grid: #263c78;
  --grid-strong: #4d68b0;
  --star: #ffd166;
  --accent: #5cc8ff;
  --accent-ink: #00141f;
  --ok: #5ee0a8;
  --bad: #ff7b86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font);
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
.eyebrow { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--star); }
h1 { margin: 6px 0 8px; font-size: clamp(26px, 4.6vw, 38px); line-height: 1.2; font-weight: 700; text-wrap: balance; }
.lede { margin: 0; max-width: 64ch; color: var(--muted); }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { appearance: none; cursor: pointer; border: 1px solid var(--border-strong); background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 500; font-size: 14px; }
.tab small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.tab:hover { border-color: var(--accent); }
.tab[aria-pressed="true"] { border-color: var(--star); color: var(--star); background: var(--panel); }
.tab.new { border-color: var(--accent); }
.tab.new small { color: var(--accent); }
.tab:disabled { opacity: .45; cursor: not-allowed; }
.tab:disabled:hover { border-color: var(--border-strong); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.step { width: 100%; text-align: left; appearance: none; cursor: pointer; background: transparent; border: 0; border-top: 3px solid var(--border-strong); padding: 8px 2px 0; display: grid; gap: 1px; }
.step .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.step .t { font-weight: 700; font-size: 14px; }
.step .s { font-size: 12px; color: var(--muted); }
.step[aria-current="step"] { border-top-color: var(--star); }
.step[aria-current="step"] .n { color: var(--star); }
.step:disabled { opacity: .45; cursor: not-allowed; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.work > * { min-width: 0; }
.plate { background: var(--plate); border: 1px solid var(--grid-strong); border-radius: 10px; overflow: hidden; }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; touch-action: none; cursor: crosshair; }
canvas.orbit { cursor: grab; }
canvas.orbit:active { cursor: grabbing; }
canvas.pick { cursor: pointer; }
canvas.still { cursor: default; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding-top: 12px; }
.msg { flex: 1 1 280px; margin: 0; min-height: 3em; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { appearance: none; cursor: pointer; border: 1px solid var(--border-strong); background: transparent; border-radius: 8px; padding: 8px 12px; font-weight: 500; font-size: 13.5px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn[aria-pressed="true"] { border-color: var(--star); color: var(--star); }
.count { font-size: 13px; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: 8px; padding: 7px 11px; }
.count b { color: var(--star); font-variant-numeric: tabular-nums; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.panel h2 { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl thead th { color: var(--muted); font-weight: 500; }
.tbl tbody th { text-align: left; font-weight: 500; font-size: 13.5px; }
.tbl tbody th small { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
.tbl tr[data-i] { cursor: pointer; }
.tbl tr.sel { background: color-mix(in srgb, var(--star) 14%, transparent); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); margin-right: 7px; }
.dot.placed { border-color: var(--accent); }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.st { color: var(--muted); font-size: 12px; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.note.big { font-size: 14px; color: var(--ink); }
.tips { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
.tctl { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--border-strong); border-radius: 8px; }
.trow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tlabel { font-size: 13px; color: var(--muted); }
.tval { font-size: 19px; font-weight: 700; color: var(--star); font-variant-numeric: tabular-nums; }
.tctl input[type="range"] { width: 100%; margin: 2px 0; accent-color: var(--accent); }
.tmarks { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.tbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.tbtns .btn { padding: 6px 10px; font-size: 13px; }
.movers { display: grid; gap: 8px; }
.mv { display: grid; grid-template-columns: 76px minmax(0, 1fr) 74px; gap: 8px; align-items: center; font-size: 13px; }
.mn { font-weight: 500; }
.mbar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
.mbar i { display: block; height: 100%; width: 0; background: var(--accent); }
.mt { text-align: right; color: var(--star); font-variant-numeric: tabular-nums; }

.guide { scroll-margin-top: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; display: grid; gap: 18px; }
.guide h2 { margin: 0; font-size: 20px; }
.guide h3 { margin: 0 0 6px; font-size: 15px; color: var(--star); }
.guide p, .guide li { margin: 0; font-size: 14px; }
.guide ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.guide .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.guide .cols > * { min-width: 0; }
.guide .tw { overflow-x: auto; }
.guide table { border-collapse: collapse; width: 100%; min-width: 600px; font-size: 13.5px; }
.guide th, .guide td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.guide th { color: var(--muted); font-weight: 500; white-space: nowrap; }

@media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  canvas { aspect-ratio: 1 / 1; }
  .step .s { display: none; }
}
</style>

<div class="app">
  <header>
    <p class="eyebrow">행성우주과학 · 별자리 실습</p>
    <h1>별자리 입체 배치</h1>
    <p class="lede" id="lede">별자리는 하늘에 그려진 그림이 아니라, 서로 다른 거리에 있는 별들을 태양에서 바라본 모습이에요. 별을 직접 제자리에 놓아 보고, 태양의 자리에서 확인해 보세요.</p>
  </header>
  <div class="tabs" id="tabs" role="group" aria-label="별자리 선택"></div>
  <ol class="steps" id="steps"></ol>
  <div class="work">
    <section>
      <div class="plate"><canvas id="cv" tabindex="0" role="img" aria-label="별을 배치하는 지도판"></canvas></div>
      <div class="bar">
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
        <div class="actions" id="actions"></div>
      </div>
    </section>
    <aside class="panel" id="panel"></aside>
  </div>
</div>

<script>
(function () {
'use strict';
var TEACHER = false;
var D2R = Math.PI / 180;
var MAS = 4.848136811e-9;   /* 밀리초각 → 라디안 */
var KMS = 3.3356e-6;        /* 1 km/s → 광년/년 */
var COUNT_SEC = 120;
var $ = function (s) { return document.querySelector(s); };
var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
var lerp = function (a, b, t) { return a + (b - a) * t; };
var dot = function (a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; };
var cross = function (a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; };
var norm = function (a) { var l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
var smooth = function (t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

/* ---------- 별 자료 ----------
   [이름, 기호, 적경(시,분,초), 적위(부호,도,분,초), 거리(광년), 고유운동 μα*(mas/년), μδ(mas/년), 시선속도(km/s)] */
var DIP = [
  ['두베', 'α', [11, 3, 43.7], [1, 61, 45, 3], 123, -136.46, -35.25, -9.4],
  ['메라크', 'β', [11, 1, 50.5], [1, 56, 22, 57], 79, 81.66, 33.74, -12.0],
  ['페크다', 'γ', [11, 53, 49.7], [1, 53, 41, 41], 84, 107.76, 11.16, -12.6],
  ['메그레즈', 'δ', [12, 15, 25.6], [1, 57, 1, 57], 81, 103.56, 7.81, -13.4],
  ['알리오스', 'ε', [12, 54, 1.7], [1, 55, 57, 35], 83, 111.74, -8.99, -9.3],
  ['미자르', 'ζ', [13, 23, 55.5], [1, 54, 55, 31], 83, 121.23, -22.01, -6.3],
  ['알카이드', 'η', [13, 47, 32.4], [1, 49, 18, 48], 104, -121.23, -15.56, -10.9]
];
var DIP_LINES = [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]];
var RAW = [
  { id: 'dipper', kind: 'normal', name: '북두칠성', sub: '일곱 별', stars: DIP, lines: DIP_LINES },
  { id: 'cassiopeia', kind: 'normal', name: '카시오페아', sub: '다섯 별',
    stars: [
      ['카프', 'β', [0, 9, 10.7], [1, 59, 8, 59], 55],
      ['쉐다르', 'α', [0, 40, 30.4], [1, 56, 32, 15], 228],
      ['나비', 'γ', [0, 56, 42.5], [1, 60, 43, 0], 550],
      ['루크바', 'δ', [1, 25, 48.9], [1, 60, 14, 7], 99],
      ['세긴', 'ε', [1, 54, 23.7], [1, 63, 40, 13], 440]
    ],
    lines: [[0, 1], [1, 2], [2, 3], [3, 4]] },
  { id: 'orion', kind: 'normal', name: '오리온', sub: '일곱 별',
    stars: [
      ['베텔게우스', 'α', [5, 55, 10.3], [1, 7, 24, 25], 550],
      ['리겔', 'β', [5, 14, 32.3], [-1, 8, 12, 6], 860],
      ['벨라트릭스', 'γ', [5, 25, 7.9], [1, 6, 20, 59], 250],
      ['사이프', 'κ', [5, 47, 45.4], [-1, 9, 40, 11], 650],
      ['알니타크', 'ζ', [5, 40, 45.5], [-1, 1, 56, 34], 1260],
      ['알닐람', 'ε', [5, 36, 12.8], [-1, 1, 12, 7], 2000],
      ['민타카', 'δ', [5, 32, 0.4], [-1, 0, 17, 57], 1200]
    ],
    lines: [[0, 2], [0, 4], [2, 6], [4, 5], [5, 6], [4, 3], [6, 1]] },
  { id: 'motion', kind: 'motion', name: '고유운동', sub: '시간 여행', stars: DIP, lines: DIP_LINES },
  { id: 'sandbox', kind: 'sandbox', name: '자유 설계', sub: '내 마음대로', stars: DIP, lines: DIP_LINES }
];

function niceStep(span, target) {
  var raw = span / Math.max(1, target);
  var p = Math.pow(10, Math.floor(Math.log10(raw)));
  var n = raw / p;
  return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p;
}
/* 3차원 화면용 기하: 점들이 모두 들어오도록 카메라 값을 정한다 */
function geoFromPts(pts) {
  var xs = pts.map(function (p) { return p[0]; });
  var xc = xs.reduce(function (a, b) { return a + b; }, 0) / xs.length;
  var Rb = 1, tanMax = 0, maxAbsY = 0;
  pts.forEach(function (p) {
    var x = Math.max(p[0], 0.5);
    Rb = Math.max(Rb, Math.hypot(p[0] - xc, p[1], p[2]));
    tanMax = Math.max(tanMax, Math.abs(p[1]) / x, Math.abs(p[2]) / x);
    maxAbsY = Math.max(maxAbsY, Math.abs(p[1]));
  });
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var gs = niceStep(Math.max(maxX - minX, 2 * maxAbsY), 6);
  var pad = 0.25 * Rb;
  return { xc: xc, Rb: Rb,
    thSun: Math.max(0.1, tanMax * 1.45), thOrb: 0.55, Rfit: Rb / (0.55 * 0.8),
    gs: gs, gx0: Math.max(0, Math.floor((minX - pad) / gs) * gs), gx1: Math.ceil((maxX + pad) / gs) * gs,
    gy: Math.ceil((maxAbsY + pad) / gs) * gs };
}

/* ---------- 좌표 변환 ----------
   별자리 중심 방향을 x축으로 하는 국소 좌표. x = 시선 방향 거리, y = 동쪽, z = 북쪽. 태양이 원점. */
RAW.forEach(function (c) {
  c.stars = c.stars.map(function (t) {
    return { name: t[0], g: t[1], d: t[4],
      ra: (t[2][0] + t[2][1] / 60 + t[2][2] / 3600) * 15,
      dec: t[3][0] * (t[3][1] + t[3][2] / 60 + t[3][3] / 3600),
      pa: t[5], pd: t[6], rv: t[7] };
  });
  var us = c.stars.map(function (s) {
    var a = s.ra * D2R, d = s.dec * D2R;
    return [Math.cos(d) * Math.cos(a), Math.cos(d) * Math.sin(a), Math.sin(d)];
  });
  var m = [0, 0, 0];
  us.forEach(function (u) { m[0] += u[0]; m[1] += u[1]; m[2] += u[2]; });
  var ex = norm(m);
  var east = norm([-ex[1], ex[0], 0]);
  var north = cross(ex, east);
  c.stars.forEach(function (s, i) {
    var u = us[i];
    s.x = s.d * dot(u, ex); s.y = s.d * dot(u, east); s.z = s.d * dot(u, north);
    s.sx = s.x; s.sy = s.y; s.sz = s.z;      /* 자유 설계에서 학생이 옮기는 위치 */
    s.vx = 0; s.vy = 0; s.vz = 0;
    if (s.pa != null) {
      var a = s.ra * D2R, d = s.dec * D2R;
      var ea = [-Math.sin(a), Math.cos(a), 0];
      var ed = [-Math.sin(d) * Math.cos(a), -Math.sin(d) * Math.sin(a), Math.cos(d)];
      var v = [0, 1, 2].map(function (k) { return s.d * (s.pa * MAS * ea[k] + s.pd * MAS * ed[k]) + s.rv * KMS * u[k]; });
      s.vx = dot(v, ex); s.vy = dot(v, east); s.vz = dot(v, north);
    }
  });
  c.n = c.stars.length;
  c.T = 200000; c.t = 0;
  c.maxD = Math.max.apply(null, c.stars.map(function (s) { return Math.hypot(s.vx, s.vy, s.vz) * c.T; })) || 1;
  var pts = [];
  c.stars.forEach(function (s) {
    pts.push([s.x, s.y, s.z]);
    if (c.kind === 'motion') {
      pts.push([s.x - s.vx * c.T, s.y - s.vy * c.T, s.z - s.vz * c.T]);
      pts.push([s.x + s.vx * c.T, s.y + s.vy * c.T, s.z + s.vz * c.T]);
    }
  });
  c.geo = geoFromPts(pts);
  var none = function () { return c.stars.map(function () { return null; }); };
  var no = function () { return c.stars.map(function () { return false; }); };
  c.pr = { max: c.kind === 'normal' ? 1 : 3, p1: none(), ok1: no(), bad1: no(), p2: none(), ok2: no(), bad2: no() };
  c.lastStep = null; c.done = false; c.fresh = false;
});

/* 지금 화면에 놓인 위치 */
function pos(c, i, t) {
  var s = c.stars[i];
  if (c.kind === 'sandbox') return [s.sx, s.sy, s.sz];
  if (t == null) t = c.kind === 'motion' ? c.t : 0;
  return [s.x + s.vx * t, s.y + s.vy * t, s.z + s.vz * t];
}
function basePos(c, i) { var s = c.stars[i]; return [s.x, s.y, s.z]; }

/* ---------- 상태 ---------- */
var cv = $('#cv'), ctx = cv.getContext('2d');
var W = 640, H = 400, DPR = 1, C = {};
var state = { ci: 0, step: 1, sel: 0, answer: false, lines: true, view: null, fview: 'side', playing: false };
var cam = { psi: 35 * D2R, phi: -24 * D2R, zoom: 1 };
var anim = null, drag = -1, justPlaced = false, drag3 = null, playLast = null;
var answerAt = {};
var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var STEP_DEFS = [
  { id: 1, t: '옆에서 본 모습', s: 'x–z 평면' },
  { id: 2, t: '위에서 본 모습', s: 'x–y 평면' },
  { id: 3, t: '태양에서 바라보기', s: '3차원 확인' }
];
var MOTION_DEFS = [
  { id: 1, t: '시간 여행', s: '옆·위 평면' },
  { id: 3, t: '태양에서 바라보기', s: '3차원 확인' }
];
var SAND_DEFS = [
  { id: 1, t: '옆에서 밀고 당기기', s: 'x–z 평면' },
  { id: 2, t: '위에서 밀고 당기기', s: 'x–y 평면' },
  { id: 3, t: '태양에서 바라보기', s: '3차원 확인' }
];
var cur = function () { return RAW[state.ci]; };
function stepsOf(c) { return c.kind === 'motion' ? MOTION_DEFS : c.kind === 'sandbox' ? SAND_DEFS : STEP_DEFS; }
function plane() { return cur().kind === 'motion' ? (state.fview === 'side' ? 1 : 2) : state.step; }
function fmt(v) { var a = Math.abs(v); var t = a >= 300 ? a.toFixed(0) : a.toFixed(1); return (v < 0 && Number(t) !== 0 ? '−' : '') + t; }
function fmtT(t) {
  if (t === 0) return '현재';

  var b = e.target.closest('[data-step]'); if (!b || b.disabled) return;
  goStep(+b.dataset.step);
});
$('#actions').addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act;
  if (a === 'check') check();
  else if (a === 'fill') autoFill();
  else if (a === 'answer') { state.answer = !state.answer; renderActions(); draw(); }
  else if (a === 'reset') resetStep();
  else if (a === 'sand-reset') resetSandbox();
  else if (a === 'next') goStep(state.step + 1);
  else if (a === 'go3') goStep(3);
  else if (a === 'fv-side') { state.fview = 'side'; renderActions(); draw(); }
  else if (a === 'fv-top') { state.fview = 'top'; renderActions(); draw(); }
  else if (a === 'lines') { state.lines = !state.lines; renderActions(); draw(); }
  else if (a === 'view-sun') animateTo(0, 0);
  else if (a === 'view-top') animateTo(90 * D2R, -89 * D2R);
  else if (a === 'view-side') animateTo(90 * D2R, 0);
  else if (a === 'view-obl') animateTo(35 * D2R, -24 * D2R);
});
$('#panel').addEventListener('click', function (e) {
  var t = e.target.closest('[data-tact]');
  if (t) {
    var a = t.dataset.tact;
    if (a === 'play') { if (state.playing) stopPlay(); else startPlay(); }
    else if (a === 'neg') setTime(-100000);
    else if (a === 'zero') setTime(0);
    else if (a === 'pos') setTime(100000);
    return;
  }
  if (e.target.closest('[data-pact="sand-reset"]')) { resetSandbox(); return; }
  var r = e.target.closest('tr[data-i]');
  if (r) {
    var i = +r.dataset.i;
    if (state.step === 3 || !okArr(state.step)[i]) { state.sel = i; renderPanel(); draw(); }
  }
});
$('#panel').addEventListener('input', function (e) {
  if (e.target.id !== 'tr') return;
  stopPlay();
  cur().t = +e.target.value;
  var tv = $('#tv'); if (tv) tv.textContent = fmtT(cur().t);
  updateMovers(); draw(); updateReadout();
});
$('#panel').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var r = e.target.closest('tr[data-i]'); if (!r) return;
  e.preventDefault(); state.sel = +r.dataset.i; renderPanel(); draw();
});

/* 정답 위치 보기: 단계에 들어가고 2분이 지나면 버튼이 나타난다 */
setInterval(function () {
  var c = cur();
  if (TEACHER || c.kind !== 'normal' || state.step === 3) return;
  var rem = answerRemain(), el = $('#cd');
  if (!el) return;
  if (rem > 0) { var b = el.querySelector('b'); if (b) b.textContent = mmss(rem); }
  else renderActions();
}, 500);

if (TEACHER) {
  var gb = document.createElement('button');
  gb.className = 'btn'; gb.id = 'guideBtn'; gb.type = 'button';
  gb.setAttribute('aria-expanded', 'false'); gb.setAttribute('aria-controls', 'guide');
  gb.textContent = '수업 안내 보기';
  gb.style.justifySelf = 'start';
  $('#lede').insertAdjacentElement('afterend', gb);
  gb.addEventListener('click', function () {
    var g = $('#guide'); if (!g) return;
    g.hidden = !g.hidden;
    gb.setAttribute('aria-expanded', String(!g.hidden));
    gb.textContent = g.hidden ? '수업 안내 보기' : '수업 안내 닫기';
    if (!g.hidden) g.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
  });
  $('.eyebrow').textContent = '교사용 · 시연 모드';
  $('#lede').textContent = '학생용 링크와는 별도의 페이지예요. 모든 탭이 열려 있고, 정답 위치를 바로 볼 수 있고, "정답으로 채우기"로 시연을 빠르게 진행할 수 있어요. 수업 안내는 아래 버튼을 눌러 열어 보세요.';
}
if (window.ResizeObserver) new ResizeObserver(setSize).observe(cv); else window.addEventListener('resize', setSize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

setMsg(defaultMsg());
renderAll();
setSize();
})();
</script>

</body></html>
